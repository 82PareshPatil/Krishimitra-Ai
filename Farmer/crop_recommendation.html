<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #28a745 !important;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }
        .prediction-section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-seedling"></i> Crop Recommendation
            </a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card form-section">
            <div class="card-body">
                <h3>Enter Soil & Climate Details</h3>
                <form id="crop-form">
                    <div class="mb-3">
                        <label for="nitrogen" class="form-label">Nitrogen (N)</label>
                        <input type="number" class="form-control" id="nitrogen" required>
                    </div>
                    <div class="mb-3">
                        <label for="phosphorus" class="form-label">Phosphorus (P)</label>
                        <input type="number" class="form-control" id="phosphorus" required>
                    </div>
                    <div class="mb-3">
                        <label for="potassium" class="form-label">Potassium (K)</label>
                        <input type="number" class="form-control" id="potassium" required>
                    </div>
                    <div class="mb-3">
                        <label for="temperature" class="form-label">Temperature (°C)</label>
                        <input type="number" class="form-control" id="temperature" required>
                    </div>
                    <div class="mb-3">
                        <label for="humidity" class="form-label">Humidity (%)</label>
                        <input type="number" class="form-control" id="humidity" required>
                    </div>
                    <div class="mb-3">
                        <label for="ph" class="form-label">Soil pH</label>
                        <input type="number" step="0.1" class="form-control" id="ph" required>
                    </div>
                    <div class="mb-3">
                        <label for="rainfall" class="form-label">Rainfall (mm)</label>
                        <input type="number" class="form-control" id="rainfall" required>
                    </div>
                    <button type="submit" class="btn btn-success">Recommend Crop</button>
                </form>
            </div>
        </div>
        <div class="card prediction-section mt-4" id="prediction-section">
            <div class="card-body">
                <h3><i class="fas fa-seedling"></i> Recommended Crop</h3>
                <p><strong>Crop:</strong> <span id="recommended-crop"></span></p>
            </div>
        </div>
    </div>
    <script>
document.getElementById('crop-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    
    const formData = {
        nitrogen: parseFloat(document.getElementById('nitrogen').value) || 0,
        phosphorus: parseFloat(document.getElementById('phosphorus').value) || 0,
        potassium: parseFloat(document.getElementById('potassium').value) || 0,
        temperature: parseFloat(document.getElementById('temperature').value) || 0,
        humidity: parseFloat(document.getElementById('humidity').value) || 0,
        ph: parseFloat(document.getElementById('ph').value) || 0,
        rainfall: parseFloat(document.getElementById('rainfall').value) || 0
    };

    console.log("Sending data:", formData);  // Debugging

    try {
        const response = await fetch('http://127.0.0.1:5002/recommend-crop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const result = await response.json();
        console.log("API Response:", result);  // Debugging

        if (response.ok) {
            document.getElementById('recommended-crop').textContent = result.recommended_crop;
            document.getElementById('prediction-section').style.display = 'block';
        } else {
            throw new Error(result.error || 'Failed to fetch recommendation');
        }
    } catch (error) {
        console.error('Error:', error);
        alert(error.message);
    }
});

    </script>
    <script> window.chtlConfig = { chatbotId: "5544824823" } </script>
    <script async data-id="5544824823" id="chatling-embed-script" type="text/javascript" src="https://chatling.ai/js/embed.js"></script>
</body>
</html>
